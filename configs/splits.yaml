# Chronological split, fixed BEFORE any test result is seen. Dates are inclusive.
# Gaps between parts are at least 30 days; those days are used by no part.
# Change log: on 2026-10-25 the validation window was widened from 2019 to two years
# (2018-02-01 to 2020-01-31), before any model was trained and before any test period
# was evaluated. Reason: one year can be dominated by a single climate event.
train:      ["2010-02-04", "2017-12-31"]
validation: ["2018-02-01", "2020-01-31"]
test_a:     ["2020-03-02", "2021-06-27"]   # latest data of the delayed-time reanalysis
test_b:     ["2021-08-01", "END"]          # interim-production target; END = last date available in ALL inputs
